// ── CONSTANTES ────────────────────────────────────────────

  {id:"historial",icon:"📋",label:"Historial",color:"#718096"},
];
const WMO={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌧️",63:"🌧️",65:"⛈️",80:"🌦️",81:"🌧️",82:"⛈️",95:"⛈️",96:"⛈️",99:"⛈️"};
const ALOJ_ICON={camping:"⛺",hostel:"🛏️",hotel:"🏨",cabaña:"🏡"};
const TIPO_SUG_ICON={"montaña":"⛰️",naturaleza:"🌿",playa:"🏖️",ciudad:"🏙️",pueblo:"🏘️",cultura:"🏛️"};
const MAX_KM_DIA=350; // km de manejo realistas por día (base del esqueleto real del viaje)
const HORA_INICIO_DIA=8; // hora a la que se asume que arranca un día de manejo intermedio
const HORA_CORTE_NOCTURNA=20; // hora límite razonable para dejar de manejar y parar a dormir

const fmtM  =n=>"$"+(Math.round(n)||0).toLocaleString("es-AR");
const fmtDt =s=>{try{return new Date(s).toLocaleString("es-AR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch{return "—";}};
const fmtDs =s=>{try{return new Date(s).toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});}catch{return "—";}};
const fmtHora=s=>{try{return new Date(s).toLocaleString("es-AR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}catch{return s||"—";}};
const fmtHoraCorta=d=>{try{return d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});}catch{return "";}};
function calcDias(f1,f2){return Math.max(1,Math.round((new Date(f2)-new Date(f1))/(1000*60*60*24))+1);}
function calcHoraLimite(fDevol,bufferHoras){
  const d=new Date(fDevol);
  d.setHours(d.getHours()-(bufferHoras||3));
  return d.toLocaleString("es-AR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Normaliza texto para comparar nombres de lugares sin importar tildes/mayúsculas.
function normTxt(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
}
// Intenta encajar el nombre que eligió la IA con un lugar REAL (de OpenStreetMap) de la lista de candidatos.
// Si encaja, usamos las coordenadas reales del candidato (nunca las que "adivinó" el modelo).
function matchPOI(nombreElegido,candidatos){
  if(!nombreElegido||!candidatos?.length) return null;
  const t=normTxt(nombreElegido);
  let m=candidatos.find(c=>normTxt(c.nombre)===t);
  if(m) return m;
  m=candidatos.find(c=>normTxt(c.nombre).includes(t)||t.includes(normTxt(c.nombre)));
  return m||null;
}

// ── CÁLCULO AUTOMÁTICO DE TIEMPOS/DURACIÓN POR PARADA ─────
// En vez de confiar en que la IA "adivine" bien los horarios (lo que generaba horarios sin sentido),
// la app calcula ella misma: parsea el tiempo de manejo entre paradas, aplica una duración mínima
// realista según el tipo de lugar, y encadena horaLlegada/horaSalida de forma consistente.
function parseMinutos(s){
  if(!s) return 0;
  s=String(s);
  const h=s.match(/(\d+)\s*h/i);
  const m=s.match(/(\d+)\s*m/i);
  let total=(h?parseInt(h[1])*60:0)+(m?parseInt(m[1]):0);
  if(!h&&!m){const n=s.match(/(\d+)/);if(n) total=parseInt(n[1]);}
  return total;
}
function fmtDuracionMin(min){
  if(!min||min<=0) return "";
  const h=Math.floor(min/60),m=min%60;
  return h>0?`${h}h${m>0?" "+m+"m":""}`:`${m}m`;
}
// Duración mínima realista según el tipo de parada (independiente de lo que diga la IA).
function duracionDefaultMin(p){
  const tipo=p.tipo;
  if(tipo==="descanso") return 15;
  if(tipo==="comida") return 45;
  if(tipo==="ruta") return 10;
  if(tipo==="dormir"||tipo==="origen"||tipo==="destino") return 0;
  const texto=((p.cat||"")+" "+(p.descripcion||"")+" "+(p.nombre||"")).toLowerCase();
  if(tipo==="mirador") return /sendero|caminata|hike/.test(texto)?45:20;
  if(tipo==="turistico"){
    if(/waterfall|cascada|catarata|garganta|sendero|caminata|trekking/.test(texto)) return 90;
    if(/museum|museo|pucara|pucará|ruinas|fuerte|historic/.test(texto)) return 60;
    if(/viewpoint|plaza|monumento|iglesia|catedral|casa de gobierno/.test(texto)) return 25;
    return 40;
  }
  return 30;
}
// Recorre TODOS los días y recalcula horaLlegada/horaSalida/duracion de cada parada en cadena,
// arrancando desde la hora real de salida de casa. Así el horario siempre es matemáticamente
// consistente, sin importar lo que haya "imaginado" la IA.
function recalcularHorariosViaje(dias,horaSalidaCasaISO){
  const fechaBase=new Date(horaSalidaCasaISO);
  return dias.map((dia,di)=>{
    let cursor;
    if(di===0){ cursor=new Date(fechaBase); }
    else{ cursor=new Date(fechaBase); cursor.setDate(cursor.getDate()+di); cursor.setHours(8,0,0,0); }
    const paradas=(dia.paradas||[]).map(p=>{
      cursor=new Date(cursor.getTime()+parseMinutos(p.tiempoManejo)*60000);
      const horaLlegada=fmtHoraCorta(cursor);
      if(p.tipo==="dormir"){ return {...p,horaLlegada,horaSalida:""}; }
      const durMin=Math.max(duracionDefaultMin(p),parseMinutos(p.duracion));
      cursor=new Date(cursor.getTime()+durMin*60000);
      const horaSalida=fmtHoraCorta(cursor);
      return {...p,horaLlegada,horaSalida,duracion:fmtDuracionMin(durMin)||p.duracion};
    });
    return {...dia,paradas};
  });
}
// Igual que recalcularHorariosViaje pero solo devuelve la hora (Date) de llegada al último
// punto del itinerario — se usa para chequear si el regreso llega a tiempo para lavar el auto
// y devolverlo antes del límite, ANTES de mostrarle el itinerario al usuario.
function calcularLlegadaFinalDate(dias,horaSalidaCasaISO){
  const fechaBase=new Date(horaSalidaCasaISO);
  let cursor=new Date(fechaBase);
  dias.forEach((dia,di)=>{
    if(di===0){ cursor=new Date(fechaBase); }
    else{ cursor=new Date(fechaBase); cursor.setDate(cursor.getDate()+di); cursor.setHours(8,0,0,0); }
    (dia.paradas||[]).forEach(p=>{
      cursor=new Date(cursor.getTime()+parseMinutos(p.tiempoManejo)*60000);
      if(p.tipo!=="dormir"){
        const durMin=Math.max(duracionDefaultMin(p),parseMinutos(p.duracion));
        cursor=new Date(cursor.getTime()+durMin*60000);
      }
    });
  });
  return cursor;
}

// Llama a Groq con reintento automático si hay rate-limit temporal (respeta el tiempo de espera que sugiere la API).
// reasoning_effort:"low" + include_reasoning:false evita que el modelo gaste tokens "pensando" en silencio.
async function callGroq(apiKey,messages,maxTokens,temperature,intento=0){
  const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
    body:JSON.stringify({model:"openai/gpt-oss-120b",max_tokens:maxTokens,temperature,response_format:{"type":"json_object"},reasoning_effort:"low",include_reasoning:false,messages})
  });
  const data=await res.json();
  if(!res.ok||data.error){
    const msg=data?.error?.message||`Error HTTP ${res.status}`;
    const m=msg.match(/try again in ([\d.]+)s/i);
    if(m&&intento<3){
      const espera=Math.min(30,Math.ceil(parseFloat(m[1]))+1);
      await sleep(espera*1000);
      return callGroq(apiKey,messages,maxTokens,temperature,intento+1);
    }
    throw new Error(msg);
  }
  return data;
}

async function geocodeNominatim(nombre){
  try{
    const q=encodeURIComponent(nombre);
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&accept-language=es`,{headers:{"User-Agent":"ViajeFacil/1.0"}});
    const d=await r.json();
    if(d.length>0) return{lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};
  }catch{}
  return null;
}

async function getOSRM(pts){
  if(pts.length<2) return null;
  try{
    const coords=pts.map(p=>`${p.lng},${p.lat}`).join(";");
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const d=await r.json();
    if(d.code==="Ok") return d.routes[0].geometry.coordinates.map(([lng,lat])=>[lat,lng]);
  }catch{}
  return null;
}

// ── RUTA REAL (OSRM) COMO BASE DEL ITINERARIO ─────────────
// A diferencia de getOSRM (que solo devuelve el trazo para dibujar el mapa), esta función
// además devuelve la distancia y duración REALES, y los "legs" (tramos entre cada waypoint
// que se le pase). Se usa para anclar todo el itinerario a la ruta de asfalto real, en vez
// de dejar que la IA "invente" por dónde pasa el viaje.
async function getOSRMRoute(pts){
  if(!pts||pts.length<2) return null;
  try{
    const coords=pts.map(p=>`${p.lng},${p.lat}`).join(";");
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`);
    const d=await r.json();
    if(d.code==="Ok"&&d.routes?.[0]){
      const ruta=d.routes[0];
      return {
        coords:ruta.geometry.coordinates.map(([lng,lat])=>[lat,lng]),
        distKm:ruta.distance/1000,
        durMin:ruta.duration/60,
        legs:(ruta.legs||[]).map(l=>({distKm:l.distance/1000,durMin:l.duration/60}))
      };
    }
  }catch{}
  return null;
}
// Distancia acumulada (km reales, siguiendo la curva del camino) en cada punto del trazo.
function cumKmDeRuta(coords){
  const cum=[0];
  for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+haversineKm(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]));
  return cum;
}
// Dado un trazo real y su distancia acumulada, devuelve el punto que está a "targetKm" del inicio.
function puntoEnKm(coords,cum,targetKm){
  let idx=0;
  for(let i=0;i<cum.length;i++){ if(cum[i]<=targetKm) idx=i; else break; }
  return {lat:coords[idx][0],lng:coords[idx][1]};
}
// Sub-tramo del trazo real entre kmMin y kmMax (con un margen), para no comparar contra
// TODA la ruta (lo que dejaría "colar" lugares cercanos al origen/destino aunque no tengan
// nada que ver con el tramo del día).
function segmentoRuta(coords,cum,kmMin,kmMax,paddingKm=15){
  const total=cum[cum.length-1]||0;
  const lo=Math.max(0,kmMin-paddingKm), hi=Math.min(total,kmMax+paddingKm);
  const out=[];
  for(let i=0;i<coords.length;i++){ if(cum[i]>=lo&&cum[i]<=hi) out.push(coords[i]); }
  return out.length?out:coords;
}
// ¿Este punto está realmente pegado al camino (a menos de toleranciaKm de algún punto del
// trazo)? Se usa para RECHAZAR lugares que la IA haya elegido fuera de la ruta real (ej. un
// pueblo lindo pero en otro valle), en vez de confiar ciegamente en las coordenadas que dio.
function cercaDeRuta(lat,lng,rutaCoords,toleranciaKm){
  if(!lat||!lng||!rutaCoords?.length) return false;
  const paso=Math.max(1,Math.floor(rutaCoords.length/400));
  for(let i=0;i<rutaCoords.length;i+=paso){
    if(haversineKm(lat,lng,rutaCoords[i][0],rutaCoords[i][1])<=toleranciaKm) return true;
  }
  return false;
}
// Detecta si el tramo del día es mayormente camino de tierra/ripio ("terraceria") o
// asfaltado, consultando el tag "surface"/"highway" de las calles reales cerca de unos
// puntos de muestra sobre el trazo. Se usa para ajustar qué tan lejos del camino puede
// estar un lugar y seguir considerándose "sobre la ruta": en ripio/montaña los desvíos y
// el GPS son menos precisos, así que conviene ser más estricto; en asfalto/autopista se
// puede ser más permisivo.
async function tipoDeCaminoSegmento(puntosMuestra){
  if(!puntosMuestra?.length) return "desconocido";
  try{
    const clausulas=puntosMuestra.map(p=>`way["highway"](around:400,${p.lat},${p.lng});`).join("");
    const ql=`[out:json][timeout:15];(${clausulas});out tags 40;`;
    const els=await overpassQuery(ql);
    if(!els.length) return "desconocido";
    const hwPavadas=new Set(["motorway","trunk","primary","secondary","tertiary","motorway_link","trunk_link","primary_link","secondary_link","tertiary_link","residential"]);
    const hwNoPavadas=new Set(["track","path"]);
    const surfPavadas=new Set(["asphalt","paved","concrete","paving_stones","concrete:plates","concrete:lanes"]);
    const surfNoPavadas=new Set(["unpaved","dirt","ground","gravel","sand","grass","compacted","earth"]);
    let paved=0,unpaved=0;
    for(const e of els){
      const tg=e.tags||{};
      if(tg.surface){
        if(surfPavadas.has(tg.surface)) paved++;
        else if(surfNoPavadas.has(tg.surface)) unpaved++;
        continue;
      }
      if(tg.highway){
        if(hwPavadas.has(tg.highway)) paved++;
        else if(hwNoPavadas.has(tg.highway)) unpaved++;
      }
    }
    if(!paved&&!unpaved) return "desconocido";
    return unpaved>paved?"terraceria":"asfaltada";
  }catch{ return "desconocido"; }
}
// Tolerancia (km) para considerar un lugar "sobre la ruta" según el tipo de camino del tramo.
function toleranciaPorTipoCamino(tipo){
  if(tipo==="terraceria") return 20;
  if(tipo==="asfaltada") return 50;
  return 40; // tipo de camino desconocido/mixto: valor intermedio
}

// ── GESTIÓN DE DÍAS Y DISTANCIAS SEGÚN LAS HORAS REALMENTE DISPONIBLES ────
// Un viaje de fin de semana (ej: retiro viernes a la tarde, devolución lunes al mediodía)
// NO tiene los mismos km/día disponibles que uno de una semana completa (retiro lunes
// temprano, devolución domingo a la noche): el primer día suele arrancar tarde (después
// del trabajo) y el último día hay que volver temprano. Esto se calcula siempre a partir
// de las fechas/horas reales de retiro y devolución que cargó el usuario — no hace falta
// que el usuario diga "es de fin de semana", la propia fecha lo determina.
// Velocidad efectiva de viaje (incluyendo paradas), a partir de la velocidad real de manejo
// que devolvió OSRM para la ruta completa.
function velocidadEfectivaKmH(distKm,durMinManejo){
  if(!distKm||!durMinManejo) return 55;
  const velManejo=distKm/(durMinManejo/60);
  return Math.min(80,Math.max(35,velManejo*0.72)); // 0.72: castiga el tiempo que se va en paradas
}
// Km que se pueden recorrer razonablemente el DÍA 1 (desde la hora real de salida de casa
// hasta una hora prudente para parar a dormir).
function kmDisponiblesDia1(horaSalidaCasaISO,velEfectiva){
  const salida=new Date(horaSalidaCasaISO);
  const corte=new Date(salida); corte.setHours(HORA_CORTE_NOCTURNA,0,0,0);
  if(corte<=salida) corte.setTime(salida.getTime()+90*60000); // salió después del corte: al menos 1.5hs
  const horas=Math.max(1,(corte-salida)/3600000);
  return Math.min(MAX_KM_DIA,Math.max(60,Math.round(horas*velEfectiva)));
}
// Fecha/hora en que arranca el día "totalDias" del itinerario (el mismo cálculo que usa
// recalcularHorariosViaje: día 1 = hora real de salida de casa, días siguientes = 8:00 de
// esa fecha + N días). OJO: esto puede NO coincidir con la fecha calendario de fDevol si la
// devolución es de madrugada (ej: devolución lunes 03:00 en realidad se vive como "domingo
// hasta la madrugada", no como "lunes a las 8"). Hay que usar SIEMPRE esta fecha, no la de
// fDevol, para no subestimar por error las horas que quedan el último día.
function inicioDelDia(fechaBaseISO,totalDias){
  const fechaBase=new Date(fechaBaseISO);
  if(totalDias<=1) return new Date(fechaBase);
  const d=new Date(fechaBase);
  d.setDate(d.getDate()+(totalDias-1));
  d.setHours(HORA_INICIO_DIA,0,0,0);
  return d;
}
// Km que se pueden recorrer razonablemente el ÚLTIMO día (desde que arranca ese día — según
// inicioDelDia, NO según la fecha de fDevol — hasta la hora límite de vuelta).
function kmDisponiblesUltimoDia(horaLimiteDate,inicioUltimoDia,velEfectiva){
  const horas=Math.max(0.5,(horaLimiteDate-inicioUltimoDia)/3600000);
  return Math.min(MAX_KM_DIA,Math.max(40,Math.round(horas*velEfectiva)));
}
// Reparte la distancia de IDA en días: el día 1 usa el cupo especial (puede ser chico si se
// sale tarde), los siguientes usan el cupo normal (MAX_KM_DIA). Devuelve null si ni usando
// todos los días disponibles alcanza para llegar.
function repartirDiasIda(distKm,kmDia1,kmDiaNormal,maxDias){
  const dias=[]; let restante=distKm,cum=0;
  for(let i=0;i<maxDias&&restante>0.01;i++){
    const cap=i===0?kmDia1:kmDiaNormal;
    const tramo=Math.min(cap,restante);
    cum+=tramo; dias.push({kmDia:Math.round(tramo),cumKm:cum}); restante-=tramo;
  }
  return restante>0.01?null:dias;
}
// Reparte la distancia de VUELTA en días: los primeros días usan el cupo normal, y el
// ÚLTIMO día (el que llega a casa) usa el cupo especial (puede ser chico si hay que volver
// temprano). Devuelve los días en orden cronológico, con cumKm = km ya recorridos de vuelta.
function repartirDiasVuelta(distKm,kmDiaNormal,kmDiaUltimo,maxDias){
  const inv=[]; let restante=distKm;
  for(let i=0;i<maxDias&&restante>0.01;i++){
    const cap=i===0?kmDiaUltimo:kmDiaNormal;
    const tramo=Math.min(cap,restante);
    inv.push(tramo); restante-=tramo;
  }
  if(restante>0.01) return null;
  inv.reverse();
  let cum=0;
  return inv.map(kmDia=>{cum+=kmDia; return {kmDia:Math.round(kmDia),cumKm:cum};});
}
// Reverse-geocoding: nombre de la localidad real más cercana a un punto del trazo (para no
// mostrar "Km 137" sino, por ejemplo, "Metán" o "Güemes").
async function nombreLocalidadCercana(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=es&zoom=12`,{headers:{"User-Agent":"ViajeFacil/1.0"}});
    const d=await r.json();
    const a=d.address||{};
    return a.city||a.town||a.village||a.municipality||a.county||null;
  }catch{}
  return null;
}

async function getClima(lat,lng,fIni,fFin){
  try{
    const hoy=new Date(); hoy.setHours(0,0,0,0);
    let d1=new Date(fIni), d2=new Date(fFin);
    if(d1<hoy) d1=new Date(hoy);
    const max=new Date(hoy); max.setDate(max.getDate()+15);
    if(d2>max) d2=new Date(max);
    if(d1>d2) return null;
    const s1=d1.toISOString().split("T")[0];
    const s2=d2.toISOString().split("T")[0];
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${s1}&end_date=${s2}`);
    const d=await r.json();
    if(d.daily) return d.daily;
  }catch{}
  return null;
}

// ── OVERPASS (datos reales de OpenStreetMap: miradores, historia, cascadas, hoteles, camping, restaurantes) ──
async function overpassQuery(ql){
  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(ql)});
    if(!r.ok) return [];
    const d=await r.json();
    return d.elements||[];
  }catch{ return []; }
}
function poiNombre(el){ return el.tags?.name||el.tags?.["name:es"]||null; }

function parsearElementosOverpass(els){
  const atractivos=[],alojamientos=[],restaurantes=[],vistos=new Set();
  for(const e of els){
    const clave=`${e.type||"node"}${e.id}`;
    if(vistos.has(clave)) continue;
    vistos.add(clave);
    const nombre=poiNombre(e); if(!nombre) continue;
    const lat=e.lat??e.center?.lat, lng=e.lon??e.center?.lon;
    if(!lat||!lng) continue;
    const tg=e.tags||{};
    if(tg.tourism&&["hotel","hostel","guest_house","camp_site","chalet"].includes(tg.tourism)){
      alojamientos.push({nombre,lat,lng,tipo:tg.tourism==="camp_site"?"camping":tg.tourism==="guest_house"?"hostel":tg.tourism==="chalet"?"cabaña":"hotel"});
    } else if(tg.amenity&&["restaurant","fast_food","cafe"].includes(tg.amenity)){
      restaurantes.push({nombre,lat,lng});
    } else {
      atractivos.push({nombre,lat,lng,cat:tg.tourism||tg.historic||tg.natural||"lugar"});
    }
  }
  return {atractivos:atractivos.slice(0,25),alojamientos:alojamientos.slice(0,15),restaurantes:restaurantes.slice(0,15)};
}
// Busca lugares turísticos REALES en un CORREDOR pegado a la ruta real del día (varios puntos
// de muestreo a lo largo del camino, con radio chico), en vez de un círculo grande alrededor
// de un punto medio — así no aparecen lugares que están lejos del camino (ej. un pueblo en otro
// valle). Los hoteles/restaurantes se buscan cerca de dónde termina el día, como antes.
async function buscarPOIsCorredor(puntosRuta,radioCorredorM,hLat,hLng){
  if(!puntosRuta?.length) return {atractivos:[],alojamientos:[],restaurantes:[]};
  const rA=Math.round(radioCorredorM), rH=hLat?20000:0, rR=hLat?15000:0;
  const clausulasAtr=puntosRuta.map(p=>`
    node["tourism"~"viewpoint|attraction|museum|artwork|zoo|gallery"](around:${rA},${p.lat},${p.lng});
    node["historic"](around:${rA},${p.lat},${p.lng});
    node["natural"~"waterfall|peak|cave_entrance"](around:${rA},${p.lat},${p.lng});`).join("");
  const ql=`[out:json][timeout:25];(${clausulasAtr}
    ${hLat?`node["tourism"~"hotel|hostel|guest_house|camp_site|chalet"](around:${rH},${hLat},${hLng});`:""}
    ${hLat?`node["amenity"~"restaurant|fast_food|cafe"](around:${rR},${hLat},${hLng});`:""}
  );out center 150;`;
  const els=await overpassQuery(ql);
  return parsearElementosOverpass(els);
}
// Compatibilidad: búsqueda con un solo punto (se usa para días de estadía, donde no hay
// un "tramo" sino un radio fijo alrededor del destino).
async function buscarPOIsDelDia(midLat,midLng,radioAtr,hLat,hLng){
  if(!midLat||!midLng) return {atractivos:[],alojamientos:[],restaurantes:[]};
  return buscarPOIsCorredor([{lat:midLat,lng:midLng}],radioAtr,hLat,hLng);
}
// Genera puntos de muestreo repartidos a lo largo del tramo [kmMin,kmMax] del trazo real,
// para armar el corredor de búsqueda de POIs de un día de manejo.
function muestrearPuntosRuta(coords,cum,kmMin,kmMax){
  const span=Math.max(0,kmMax-kmMin);
  const n=span<40?2:(span<150?4:6);
  const pts=[];
  for(let i=0;i<n;i++){
    const t=n===1?0.5:i/(n-1);
    pts.push(puntoEnKm(coords,cum,kmMin+span*t));
  }
  return pts;
}

let _map=null,_ml=null,_rl=null,_gm=null,_lastBounds=null;
window._centrarMapa=(lat,lng)=>{if(_map&&lat&&lng){_map.setView([lat,lng],14);}};
function MapaLeaflet({paradas,posGPS}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||_map) return;
    _map=L.map(ref.current,{zoomControl:true}).setView([-27,-65],6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(_map);
    setTimeout(()=>{if(_map)_map.invalidateSize();},150);
    return ()=>{
      if(_map){ try{_map.remove();}catch{} }
      _map=null;_ml=null;_rl=null;_gm=null;_lastBounds=null;
    };
  },[]);
  useEffect(()=>{
    if(!_map) return;
    if(_ml){_map.removeLayer(_ml);_ml=null;}
    if(_rl){_map.removeLayer(_rl);_rl=null;}
    let pts=(paradas||[]).filter(p=>p.lat&&p.lng&&p.lat>=-55&&p.lat<=-21&&p.lng>=-73&&p.lng<=-53);
    if(!pts.length) return;
    _ml=L.layerGroup().addTo(_map);
    const bounds=[];
    pts.forEach((p,idx)=>{
      const t=TIPOS[p.tipo]||TIPOS.turistico;
      const ico=L.divIcon({
        html:`<div style="position:relative;width:38px;height:38px"><div style="background:${t.color};color:white;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,0.4);border:2px solid white;">${t.icon}</div><div style="position:absolute;top:-5px;right:-5px;background:#1a202c;color:white;border-radius:50%;min-width:17px;height:17px;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:1.5px solid white;padding:0 2px">${idx+1}</div></div>`,
        className:"",iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-22]
      });
      let popHtml=`<div style="min-width:220px;font-family:system-ui"><div style="background:${t.color};color:white;padding:8px 12px;margin:-13px -19px 10px;border-radius:4px 4px 0 0;font-weight:bold">#${idx+1} ${t.icon} ${p.nombre}</div><div style="font-size:12px;color:#555;margin-bottom:6px">${t.label}${p.horaLlegada?" · 🕐 Llega "+p.horaLlegada:""}${p.horaSalida?" · Sale "+p.horaSalida:""}</div>${p.descripcion?`<div style="font-size:13px;color:#333;margin-bottom:6px">${p.descripcion}</div>`:""}${p.kmDesdeAnterior?`<div style="font-size:11px;color:#888">📏 ${p.kmDesdeAnterior}${p.tiempoManejo?" · ⏱ "+p.tiempoManejo:""}</div>`:""}`;
      if(p.alojamientos?.length){popHtml+=`<div style="margin-top:6px;font-weight:bold;font-size:12px">🏨 Hospedaje (sugerido por IA — verificar):</div>`;p.alojamientos.forEach(a=>{popHtml+=`<div style="font-size:12px;padding:2px 0">${ALOJ_ICON[a.tipo]||"🏨"} <b>${a.nombre}</b> · <span style="color:#38a169">${a.precio}</span></div>`;});}
      if(p.restaurantes?.length){popHtml+=`<div style="margin-top:6px;font-weight:bold;font-size:12px">🍽️ Comer (sugerido por IA — verificar):</div>`;p.restaurantes.forEach(r=>{popHtml+=`<div style="font-size:12px;padding:2px 0"><b>${r.nombre}</b> · <span style="color:#ed8936">${r.precio}</span></div>`;});}
      popHtml+=`<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" style="display:block;margin-top:8px;background:#2b6cb0;color:white;text-align:center;padding:7px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:bold">🧭 Navegar</a></div>`;
      L.marker([p.lat,p.lng],{icon:ico}).bindPopup(popHtml,{maxWidth:260}).addTo(_ml);
      bounds.push([p.lat,p.lng]);
    });
    if(pts.length>=2){
      getOSRM(pts).then(ruta=>{
        if(!_map) return;
        if(_rl){_map.removeLayer(_rl);_rl=null;}
        _rl=L.polyline(ruta||pts.map(p=>[p.lat,p.lng]),{color:"#2b6cb0",weight:5,opacity:.8,dashArray:ruta?null:"10,6"}).addTo(_map);
      });
    }
    if(bounds.length){_lastBounds=bounds;_map.fitBounds(bounds,{padding:[40,40],maxZoom:11});}
  },[paradas]);
  useEffect(()=>{
    if(!_map) return;
    if(_gm){_map.removeLayer(_gm);_gm=null;}
    if(!posGPS) return;
    const ico=L.divIcon({html:`<div style="background:#805ad5;border:3px solid white;border-radius:50%;width:22px;height:22px;animation:pulse 2s infinite"></div>`,className:"",iconSize:[22,22],iconAnchor:[11,11]});
    _gm=L.marker([posGPS.lat,posGPS.lng],{icon:ico}).bindPopup("📍 Tu posición").addTo(_map);
  },[posGPS]);
  return(<div style={{position:"relative",height:"100%"}}><div ref={ref} style={{width:"100%",height:"100%"}}/></div>);
}

function ModalAgregarParada({opcionSel,onAgregar,onCerrar}){
  const dias=opcionSel?.dias||[];
  const [f,setF]=useState({nombre:"",tipo:"turistico",horaLlegada:"",descripcion:""});
  const [diaSel,setDiaSel]=useState(Math.max(0,dias.length-1));
  const [buscando,setBuscando]=useState(false);
  const agregar=async()=>{
    if(!f.nombre) return;
    setBuscando(true);
    const coord=await geocodeNominatim(f.nombre+", Argentina");
    setBuscando(false);
    onAgregar({...f,lat:coord?.lat,lng:coord?.lng,alojamientos:[],restaurantes:[]},diaSel);
  };
  return(
    <div style={S.ovr} onClick={onCerrar}>
      <div style={S.sht} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:"bold",fontSize:19,marginBottom:4,color:"var(--text)"}}>➕ Agregar Parada Propia</div>
        <div style={{fontSize:12,color:"var(--text-soft)",marginBottom:10}}>No hay límite de paradas. El horario de esta parada y el de las siguientes se recalcula automáticamente al agregarla.</div>
        {dias.length>1&&(<>
          <label style={{...S.lbl,marginTop:0}}>Agregar al día</label>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
            {dias.map((d,i)=>(
              <button key={i} onClick={()=>setDiaSel(i)} style={{background:diaSel===i?"#38a169":"var(--input-bg)",color:diaSel===i?"white":"var(--text)",border:`1.5px solid ${diaSel===i?"#38a169":"var(--border)"}`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:13,fontWeight:"bold"}}>Día {d.dia}</button>
            ))}
          </div>
        </>)}
        <label style={{...S.lbl,marginTop:dias.length>1?0:0}}>Nombre del lugar *</label>
        <input style={S.inp} placeholder="Ej: Dique El Jumeal" value={f.nombre} onChange={e=>setF(p=>({...p,nombre:e.target.value}))}/>
        <label style={S.lbl}>Tipo de parada</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:4}}>
          {Object.entries(TIPOS).filter(([k])=>k!=="origen"&&k!=="destino").map(([k,t])=>(
            <button key={k} onClick={()=>setF(p=>({...p,tipo:k}))} style={{background:f.tipo===k?t.color:"var(--input-bg)",color:f.tipo===k?"white":"var(--text)",border:`1.5px solid ${f.tipo===k?t.color:"var(--border)"}`,borderRadius:8,padding:"8px",cursor:"pointer",fontSize:13}}>{t.icon} {t.label}</button>
          ))}
        </div>
        <label style={S.lbl}>Descripción (opcional)</label>
        <input style={S.inp} placeholder="Ej: Paseo junto al dique" value={f.descripcion} onChange={e=>setF(p=>({...p,descripcion:e.target.value}))}/>
        <div style={{fontSize:11,color:"var(--text-soft)",marginTop:-2,marginBottom:6}}>La hora de llegada/salida la calcula la app sola según el tipo de lugar — no hace falta cargarla a mano.</div>

function PantallaConfig({apiKey,setApiKey,darkMode,setDarkMode,lugaresGuardados,onAgregarLugar,onEliminarLugar}){
  const [tmp,setTmp]=useState(apiKey);
  const [ok,setOk]=useState(false);
  const [nombreNuevo,setNombreNuevo]=useState("");
  const [dirNueva,setDirNueva]=useState("");
  const guardar=()=>{const k=tmp.trim();setApiKey(k);LS.set("apiKey",k);setOk(true);setTimeout(()=>setOk(false),2500);};
  const agregar=()=>{
    if(!nombreNuevo.trim()||!dirNueva.trim()) return;
    onAgregarLugar(nombreNuevo,dirNueva);
    setNombreNuevo("");setDirNueva("");
  };
  return(
    <div>
      <div style={S.hdr("#4a5568")}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:22,fontWeight:"bold"}}>⚙️ Config</div><div style={{fontSize:10,opacity:.6,background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"2px 6px"}}>v{VERSION}</div></div>
        <div style={{fontSize:13,opacity:.8}}>Configuración guardada en tu celular</div>
      </div>
      <div style={{padding:16}}>
        <div style={S.card}>
          <div style={{fontWeight:"bold",color:"var(--text)",fontSize:15,marginBottom:8}}>🤖 API Key de Groq (gratis)</div>
          <div style={{fontSize:13,color:"var(--text-soft)",marginBottom:12,lineHeight:1.6}}>Se guarda solo en este celular/navegador, no se envía a ningún otro lado más que a Groq.<br/>📌 Conseguila en: <strong>console.groq.com</strong><br/>ℹ️ Antes de generar cada día, la app busca sola lugares reales verificados (OpenStreetMap: miradores, historia, cascadas, hoteles, camping, restaurantes) cerca de la ruta y del destino, los agrega automáticamente al itinerario (sin límite de cantidad) y calcula ella misma cuánto tiempo lleva cada parada según su tipo — vos podés reordenarlas o sacarlas cuando quieras.</div>
          {apiKey&&<div style={{padding:10,background:"#f0fff4",border:"1px solid #9ae6b4",borderRadius:10,marginBottom:12,fontSize:13,color:"#276749"}}>✅ Clave guardada — IA lista</div>}
          <input style={{...S.inp,fontFamily:"monospace",fontSize:12}} type="password" placeholder="gsk_..." value={tmp} onChange={e=>setTmp(e.target.value)}/>
          <button style={S.btn(ok?"#38a169":"#4a5568")} onClick={guardar}>{ok?"✅ ¡Guardada!":"💾 Guardar clave"}</button>
        </div>
        <div style={S.card}>
          <div style={{fontWeight:"bold",color:"var(--text)",fontSize:15,marginBottom:8}}>📍 Lugares guardados</div>
          <div style={{fontSize:13,color:"var(--text-soft)",marginBottom:12,lineHeight:1.6}}>Guardá direcciones reales que usás seguido — tu casa, la de un familiar, etc. Un lugar llamado exactamente "Casa" se completa solo como origen al planificar un viaje nuevo; todos aparecen como botones rápidos para elegir origen o destino.</div>
          {lugaresGuardados?.length>0&&(
            <div style={{marginBottom:12}}>
              {lugaresGuardados.map(l=>(
                <div key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"8px 10px",background:"#f7fafc",borderRadius:10,marginBottom:6}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:"bold",fontSize:13,color:"#2d3748"}}>📍 {l.nombre}</div>
                    <div style={{fontSize:12,color:"#718096",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.direccion}</div>
                  </div>
                  <button onClick={()=>onEliminarLugar(l.id)} aria-label={`Eliminar ${l.nombre}`} style={{background:"none",border:"none",color:"#e53e3e",cursor:"pointer",fontSize:16,flexShrink:0}}>🗑</button>

          <input style={S.inp} placeholder="Dirección o ciudad real (ej: Batalla de Ayacucho 2728, San Miguel de Tucumán)" value={dirNueva} onChange={e=>setDirNueva(e.target.value)}/>
          <button style={S.btn("#4a5568")} onClick={agregar}>➕ Agregar lugar</button>
        </div>
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:"bold",color:"var(--text)",fontSize:14}}>{darkMode?"🌙 Modo oscuro":"☀️ Modo claro"}</div>
            <button onClick={()=>setDarkMode(d=>!d)} aria-label="Cambiar entre modo claro y oscuro" style={{background:darkMode?"#2b6cb0":"#e2e8f0",border:"none",borderRadius:20,width:52,height:28,cursor:"pointer",position:"relative",flexShrink:0}}>
              <div style={{position:"absolute",top:3,left:darkMode?27:3,width:22,height:22,borderRadius:"50%",background:"white",transition:"left .2s"}}/>
            </button>
          </div>

          <div style={{fontWeight:"bold",color:"var(--text)",fontSize:14,marginBottom:8}}>🔔 Notificaciones</div>
          <div style={{fontSize:13,color:"var(--text-soft)",marginBottom:10}}>Activá las notificaciones para recibir alertas del tiempo de devolución aunque la app esté cerrada.</div>
          <button style={S.btn("#805ad5",true)} onClick={()=>{
            if("Notification" in window){
              Notification.requestPermission().then(p=>{
                if(p==="granted") new Notification("✅ ViajeFácil",{body:"Notificaciones activadas correctamente"});
              });
            }
          }}>🔔 Activar notificaciones</button>
        </div>
        <div style={S.card}>
          <div style={{fontWeight:"bold",color:"var(--text)",fontSize:14,marginBottom:8}}>🔄 Forzar actualización</div>
          <button style={S.btn("#e53e3e",true)} onClick={()=>{
            if('serviceWorker' in navigator){
              navigator.serviceWorker.getRegistrations().then(regs=>{
                regs.forEach(r=>r.unregister());
                caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).then(()=>window.location.reload(true));
              });
            } else { window.location.reload(true); }
          }}>🗑️ Limpiar caché y recargar</button>
        </div>
      </div>
    </div>
  );
}

// Link a Google Maps con el recorrido completo (origen → lugares de referencia → destino),
// para poder abrirlo/gestionarlo directamente ahí (navegación turno a turno, tráfico en vivo, etc).
function googleMapsDirUrl(origen,destino,lugares){
  const base="https://www.google.com/maps/dir/?api=1&travelmode=driving";
  const o=`&origin=${encodeURIComponent(origen+", Argentina")}`;
  const d=`&destination=${encodeURIComponent(destino+", Argentina")}`;
  const wp=lugares?.length?`&waypoints=${encodeURIComponent(lugares.slice(0,8).map(l=>l+", Argentina").join("|"))}`:"";
  return base+o+d+wp;
}
// Link a Google Maps con las paradas REALES ya verificadas de un día del itinerario generado
// (usa coordenadas exactas en vez de nombres, para que Google Maps navegue el mismo recorrido
// que armó la app).
function googleMapsDirUrlDia(paradas){
  const puntos=(paradas||[]).filter(p=>p.lat&&p.lng);
  if(puntos.length<2) return null;
  const origin=`${puntos[0].lat},${puntos[0].lng}`;
  const destination=`${puntos[puntos.length-1].lat},${puntos[puntos.length-1].lng}`;
  const wpPts=puntos.slice(1,-1).slice(0,8);
  const wp=wpPts.length?`&waypoints=${encodeURIComponent(wpPts.map(p=>`${p.lat},${p.lng}`).join("|"))}`:"";
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${origin}&destination=${destination}${wp}`;
}

// Mini-mapa de previsualización para una de las 3 opciones de ruta: geocodifica origen/destino
// (y hasta 2 lugares de referencia como waypoints reales) y dibuja el trazo real de OSRM, para
// que se pueda ver de un vistazo por dónde pasa esa opción antes de generar el itinerario completo.
function MapaRutaPreview({origen,destino,lugares}){
  const ref=useRef(null);
  const mapRef=useRef(null);
  const [estado,setEstado]=useState("cargando");
  useEffect(()=>{
    let cancelado=false;
    (async()=>{
      setEstado("cargando");
      const oc=await geocodeNominatim(origen+", Argentina"); await sleep(700);
      if(cancelado) return;
      const dc=await geocodeNominatim(destino+", Argentina"); await sleep(700);
      if(cancelado) return;
      if(!oc||!dc){ setEstado("error"); return; }
      const viaCoords=[];
      for(const lug of (lugares||[]).slice(0,2)){
        const c=await geocodeNominatim(lug+", Argentina");
        await sleep(700);
        if(cancelado) return;
        if(c) viaCoords.push(c);
      }
      const trazo=await getOSRM([oc,...viaCoords,dc]);
      if(cancelado||!ref.current) return;
      if(mapRef.current){ try{mapRef.current.remove();}catch{} mapRef.current=null; }
      const map=L.map(ref.current,{zoomControl:false,attributionControl:false,dragging:true,scrollWheelZoom:false}).setView([oc.lat,oc.lng],6);
      mapRef.current=map;
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
      const bounds=[[oc.lat,oc.lng],[dc.lat,dc.lng]];
      const icoO=L.divIcon({html:`<div style="background:#38a169;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.35)">🚀</div>`,className:"",iconSize:[26,26],iconAnchor:[13,13]});
      const icoD=L.divIcon({html:`<div style="background:#e53e3e;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.35)">🏁</div>`,className:"",iconSize:[26,26],iconAnchor:[13,13]});
      L.marker([oc.lat,oc.lng],{icon:icoO}).addTo(map);
      L.marker([dc.lat,dc.lng],{icon:icoD}).addTo(map);
      if(trazo?.length){
        L.polyline(trazo,{color:"#2b6cb0",weight:4,opacity:.85}).addTo(map);
        trazo.forEach(p=>bounds.push(p));
      }
      map.fitBounds(bounds,{padding:[24,24]});
      setTimeout(()=>{ if(mapRef.current) mapRef.current.invalidateSize(); },120);
      setEstado("ok");
    })();
    return ()=>{
      cancelado=true;
      if(mapRef.current){ try{mapRef.current.remove();}catch{} mapRef.current=null; }
    };
  },[origen,destino]);
  return(
    <div style={{position:"relative",height:190,borderRadius:12,overflow:"hidden",marginBottom:10,background:"#eef2f6"}}>
      <div ref={ref} style={{width:"100%",height:"100%"}}/>
      {estado==="cargando"&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#718096",background:"#eef2f6"}}>🗺️ Cargando mapa...</div>}
      {estado==="error"&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#e53e3e",background:"#fff5f5",textAlign:"center",padding:12}}>No se pudo ubicar el recorrido en el mapa</div>}
    </div>
  );
}

  );
}

function PantallaGastos({gastos,setGastos,pers,setPers,setModal}){
  const total=gastos.reduce((s,g)=>s+g.monto,0);
  const porPers=pers>0?Math.ceil(total/pers):total;
  return(
    <div>
      <div style={S.hdr("#d69e2e")}><div style={{fontSize:22,fontWeight:"bold"}}>💰 Gastos</div><div style={{fontSize:13,opacity:.8}}>Total: {fmtM(total)}</div></div>
      <div style={{padding:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          {Object.entries(CATS).map(([k,c])=>{const t=gastos.filter(g=>g.cat===k).reduce((s,g)=>s+g.monto,0);return(<div key={k} style={{...S.card,textAlign:"center",padding:12,marginBottom:0,borderLeft:`4px solid ${c.color}`}}><div style={{fontSize:22}}>{c.icon}</div><div style={{fontSize:12,color:"var(--text-soft)",marginTop:2}}>{c.label}</div><div style={{fontSize:16,fontWeight:"bold",color:c.color}}>{fmtM(t)}</div></div>);})}
        </div>
        <div style={S.card}>
          <div style={{fontWeight:"bold",color:"var(--text)",marginBottom:10}}>👥 División por persona</div>
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:10}}>
            <span style={{fontSize:13,color:"var(--text-soft)"}}>Personas:</span>
            <button onClick={()=>setPers(p=>Math.max(1,p-1))} aria-label="Restar persona" style={{width:32,height:32,borderRadius:16,border:"1.5px solid var(--border)",background:"var(--input-bg)",color:"var(--text)",cursor:"pointer",fontWeight:"bold",fontSize:18}}>-</button>
            <span style={{fontWeight:"bold",fontSize:20,minWidth:24,textAlign:"center",color:"var(--text)"}}>{pers}</span>
            <button onClick={()=>setPers(p=>p+1)} aria-label="Sumar persona" style={{width:32,height:32,borderRadius:16,border:"1.5px solid var(--border)",background:"var(--input-bg)",color:"var(--text)",cursor:"pointer",fontWeight:"bold",fontSize:18}}>+</button>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:"1px solid var(--border)"}}><span style={{color:"var(--text-soft)",fontSize:14}}>Por persona:</span><span style={{fontWeight:"bold",color:"#d69e2e",fontSize:22}}>{fmtM(porPers)}</span></div>
        </div>
        <button style={S.btn("#d69e2e")} onClick={()=>setModal("gasto")}>+ Agregar Gasto</button>
        <button style={S.btn("#d69e2e",true)} onClick={()=>setModal("nafta")}>⛽ Calculadora de Nafta</button>
        {gastos.length>0&&(<div style={S.card}><div style={{fontWeight:"bold",marginBottom:8}}>📋 Gastos</div>{[...gastos].reverse().map(g=>(<div key={g.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid var(--border)"}}><div><span>{CATS[g.cat].icon} </span><span style={{fontSize:13}}>{g.desc||CATS[g.cat].label}</span><div style={{fontSize:11,color:"#a0aec0"}}>{g.fecha}</div></div><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontWeight:"bold",color:CATS[g.cat].color}}>{fmtM(g.monto)}</span><button onClick={()=>setGastos(p=>p.filter(x=>x.id!==g.id))} aria-label="Eliminar gasto" style={{background:"none",border:"none",color:"#fc8181",cursor:"pointer",fontSize:18}}>✕</button></div></div>))}</div>)}
        {gastos.length===0&&<div style={{...S.card,textAlign:"center",padding:28,color:"#a0aec0"}}><div style={{fontSize:40}}>💸</div><div style={{marginTop:8}}>Sin gastos aún</div></div>}
      </div>
    </div>
  );
}

function PantallaHistorial({historial,onEliminar}){
  const [verIdx,setVerIdx]=useState(null);
  if(!historial.length) return(<div><div style={S.hdr("#718096")}><div style={{fontSize:22,fontWeight:"bold"}}>📋 Historial</div></div><div style={{padding:16}}><div style={{...S.card,textAlign:"center",padding:44}}><div style={{fontSize:52}}>🗺️</div><div style={{fontSize:17,fontWeight:"bold",marginTop:14}}>Sin viajes aún</div></div></div></div>);
  return(
    <div>
      <div style={S.hdr("#718096")}><div style={{fontSize:22,fontWeight:"bold"}}>📋 Historial</div><div style={{fontSize:13,opacity:.8}}>{historial.length} viaje(s)</div></div>
      <div style={{padding:16}}>
        {[...historial].reverse().map((h,i)=>{
          const totalG=h.gastos?.reduce((s,g)=>s+g.monto,0)||0;
          return(
            <div key={h.id||i} style={S.card}>
              <div style={{fontWeight:"bold",fontSize:15}}>📍 {h.viaje?.origen} → {h.viaje?.destino}</div>
              <div style={{fontSize:12,color:"var(--text-soft)",marginTop:2}}>{fmtDs(h.viaje?.fRetiro)} · {h.viaje?.pers} pers{h.viaje?.auto?` · ${h.viaje.auto}`:""}</div>
              {h.opcionSel&&<div style={{fontSize:12,color:"#38a169",marginTop:4}}>🗂️ {h.opcionSel.nombre}</div>}
              {totalG>0&&<div style={{fontSize:13,color:"#e53e3e",marginTop:4,fontWeight:"bold"}}>💰 {fmtM(totalG)}{h.viaje?.pers>1?` · ${fmtM(Math.ceil(totalG/h.viaje.pers))}/persona`:""}</div>}
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <button onClick={()=>setVerIdx(verIdx===i?null:i)} style={{...S.btn("#718096",true),flex:1,marginTop:0,padding:"8px",fontSize:13}}>{verIdx===i?"▲ Ocultar":"👁 Ver"}</button>
                <button onClick={()=>{if(confirm("¿Eliminar?"))onEliminar(h.id);}} aria-label="Eliminar viaje del historial" style={{...S.btn("#e53e3e",true),width:"auto",marginTop:0,padding:"8px 14px",fontSize:13}}>🗑</button>
              </div>
              {verIdx===i&&h.opcionSel?.dias&&(
                <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid var(--border)"}} className="fade-in">
                  {h.opcionSel.dias.map((dia,di)=>(
                    <div key={di} style={{marginBottom:10}}>
                      <div style={{fontWeight:"bold",fontSize:13,marginBottom:6,background:"#f4f4f4",padding:"6px 10px",borderRadius:8,color:"#2d3748"}}>📅 Día {dia.dia}: {dia.titulo}</div>
                      {dia.paradas?.map((p,pi)=>{const t=TIPOS[p.tipo]||TIPOS.turistico;return(<div key={pi} style={{display:"flex",gap:8,padding:"5px 0",borderBottom:"1px solid #f9f9f9",alignItems:"center"}}><span>{t.icon}</span><div><span style={{fontSize:13,fontWeight:"bold"}}>{p.nombre}</span>{p.horaLlegada&&<span style={{fontSize:11,color:"#718096"}}> · 🕐{p.horaLlegada}</span>}</div></div>);})}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

Sos un planificador de rutas experto en el NOA argentino. El objetivo es MAXIMIZAR la cantidad de lugares reales e interesantes que se pueden visitar en el tiempo disponible (lo que Google Maps no calcula: descansos, combustible, paradas para conocer sin desviarse demasiado).

Para cada opcion calcula:

  // ── ESQUELETO REAL DEL VIAJE ─────────────────────────────
  // En vez de pedirle a la IA que "adivine" día por día por dónde pasa el viaje (lo que
  // generaba recorridos que iban de un lado a otro sin respetar el origen/destino real),
  // acá se calcula el recorrido con datos reales: se geocodifica origen y destino, se pide
  // la ruta real por calles/rutas a OSRM (pasando por las localidades de referencia que
  // sugirió la opción elegida, si las hay) y se reparte esa ruta real en tramos de como
  // máximo MAX_KM_DIA km por día, siempre avanzando sobre el camino real — nunca saltando
  // a un lugar que no está en el camino.
  const construirEsqueletoReal=async(opcion,totalDias)=>{
    const origCoord=await geocodeNominatim(viaje.origen+", Argentina"); await sleep(1100);
    const destCoord=await geocodeNominatim(viaje.destino+", Argentina"); await sleep(1100);
    if(!origCoord||!destCoord) return null;

    // Si la opción elegida sugiere localidades de referencia (ej: "Cafayate"), las usamos
    // como waypoints reales para que la ruta de OSRM efectivamente pase por ahí (ruta
    // panorámica real), en vez de solo confiar en el nombre.
    const viaCoords=[];
    for(const lug of (opcion?.lugaresEnRuta||[]).slice(0,3)){
      const c=await geocodeNominatim(lug+", Argentina");
      await sleep(1100);
      if(c) viaCoords.push(c);
    }
    const ruta=await getOSRMRoute([origCoord,...viaCoords,destCoord]);
    if(!ruta) return null;
    const distKm=ruta.distKm;
    const cum=cumKmDeRuta(ruta.coords);

    // Horas realmente disponibles según retiro/devolución: esto es lo que distingue un
    // fin de semana (sale tarde el viernes, tiene que volver temprano el lunes) de una
    // semana completa (sale temprano, tiene todo el último día disponible) — no hace falta
    // preguntarle al usuario qué tipo de viaje es, lo dice la fecha/hora que ya cargó.
    const horaLimiteDate=new Date(viaje.fDevol);
    horaLimiteDate.setHours(horaLimiteDate.getHours()-(viaje.buffer||3));
    const velEfectiva=velocidadEfectivaKmH(distKm,ruta.durMin);
    const kmDia1=kmDisponiblesDia1(viaje.horaSalidaCasa||viaje.fRetiro,velEfectiva);
    const inicioUltimoDia=inicioDelDia(viaje.horaSalidaCasa||viaje.fRetiro,totalDias);
    const kmDiaUltimo=kmDisponiblesUltimoDia(horaLimiteDate,inicioUltimoDia,velEfectiva);

    // Viaje de un solo día (ida y vuelta el mismo día): no hay noche de por medio — el cupo
    // es el tiempo real entre la salida de casa y la hora límite de vuelta, restando un
    // mínimo para conocer algo en el destino.
    if(totalDias===1){
      const horaSalida=new Date(viaje.horaSalidaCasa||viaje.fRetiro);
      const horasDisponibles=Math.max(0,(horaLimiteDate-horaSalida)/3600000);
      const horasManejoDisp=Math.max(0,horasDisponibles-1.5);
      const kmDisponibleTotal=horasManejoDisp*velEfectiva;
      if(distKm*2>kmDisponibleTotal){
        throw new Error(`${viaje.destino} está a ${Math.round(distKm)} km de ${viaje.origen} (~${fmtDuracionMin(Math.round(ruta.durMin))} de manejo por tramo). Entre que salís (${fmtHoraCorta(horaSalida)}) y el límite para volver (${fmtHoraCorta(horaLimiteDate)}) tenés ${horasDisponibles.toFixed(1)}hs, y no alcanza para ir, conocer algo y volver el mismo día. Sumá más días al viaje o elegí un destino más cercano.`);
      }
      return {dias:[{dia:1,desde:viaje.origen,hasta:viaje.origen,desdeCoord:origCoord,hastaCoord:origCoord,destinoDia:destCoord,kmDia:Math.round(distKm*2),tipo:"idaYvuelta",kmMin:0,kmMax:distKm}],rutaCoords:ruta.coords,rutaCum:cum,rutaDistKm:distKm,rutaDurMin:ruta.durMin};
    }

    // Días mínimos de ida (día 1 con el cupo reducido si se sale tarde, resto a MAX_KM_DIA)
    // y de vuelta (último día con el cupo reducido si hay que volver temprano) — si ninguno
    // alcanza ni usando todos los días del viaje, es un viaje inviable con esas fechas.
    const arrIda=repartirDiasIda(distKm,kmDia1,MAX_KM_DIA,totalDias);
    const arrVuelta=arrIda?repartirDiasVuelta(distKm,MAX_KM_DIA,kmDiaUltimo,totalDias):null;
    if(!arrIda||!arrVuelta){
      throw new Error(`${viaje.destino} está a ${Math.round(distKm)} km de ${viaje.origen}. Con las horas reales que tenés disponibles el primer y el último día (salís ${fmtHoraCorta(new Date(viaje.horaSalidaCasa||viaje.fRetiro))}, tenés que estar de vuelta antes de ${fmtHoraCorta(horaLimiteDate)}), ni usando todos los días del viaje (${totalDias}) alcanza para ir y volver. Ampliá los días del viaje o elegí un destino más cercano.`);
    }
    const idaDias=arrIda.length, vueltaDias=arrVuelta.length;
    const estadiaDias=totalDias-idaDias-vueltaDias;
    if(estadiaDias<0){
      throw new Error(`${viaje.destino} está a ${Math.round(distKm)} km de ${viaje.origen} (${idaDias} día(s) de ida y ${vueltaDias} de vuelta, según las horas reales disponibles cada día). Con los días que elegiste (${totalDias}) no alcanza para ir Y volver. Ampliá los días del viaje o elegí un destino más cercano.`);
    }

    const dias=[];
    // IDA: se usa el reparto real (día 1 puede ser más corto si se sale tarde) y se ubica
    // cada corte sobre el trazo real de la ruta (no en cualquier lugar "cerca" del medio).
    let prevTarget=0,coordPrevia=origCoord,nombrePrevio=viaje.origen;
    for(let i=0;i<arrIda.length;i++){
      const targetKm=arrIda[i].cumKm;
      const esUltima=i===arrIda.length-1;
      const coordDia=esUltima?destCoord:puntoEnKm(ruta.coords,cum,targetKm);
      let nombreDia=esUltima?viaje.destino:null;
      if(!esUltima){ nombreDia=await nombreLocalidadCercana(coordDia.lat,coordDia.lng); await sleep(1100); }
      if(!nombreDia) nombreDia=esUltima?viaje.destino:`Km ${Math.round(targetKm)} rumbo a ${viaje.destino}`;
      dias.push({dia:dias.length+1,desde:nombrePrevio,hasta:nombreDia,desdeCoord:coordPrevia,hastaCoord:coordDia,kmDia:arrIda[i].kmDia,tipo:"ida",kmMin:prevTarget,kmMax:targetKm});
      prevTarget=targetKm; coordPrevia=coordDia; nombrePrevio=nombreDia;
    }
    // ESTADÍA: días completos en el destino, sin grandes traslados.
    for(let i=0;i<estadiaDias;i++){
      dias.push({dia:dias.length+1,desde:viaje.destino,hasta:viaje.destino,desdeCoord:destCoord,hastaCoord:destCoord,kmDia:0,tipo:"estadia",kmMin:null,kmMax:null});
    }
    // VUELTA: mismo trazo real, en sentido inverso, con el último día ajustado a la hora
    // límite real de devolución.
    let prevVTarget=0; coordPrevia=destCoord; nombrePrevio=viaje.destino;
    for(let i=0;i<arrVuelta.length;i++){
      const vTarget=arrVuelta[i].cumKm;
      const posDesdeOrigen=distKm-vTarget;
      const esUltima=i===arrVuelta.length-1;
      const coordDia=esUltima?origCoord:puntoEnKm(ruta.coords,cum,posDesdeOrigen);
      let nombreDia=esUltima?viaje.origen:null;
      if(!esUltima){ nombreDia=await nombreLocalidadCercana(coordDia.lat,coordDia.lng); await sleep(1100); }
      if(!nombreDia) nombreDia=esUltima?viaje.origen:`Km ${Math.round(posDesdeOrigen)} rumbo a ${viaje.origen}`;
      const kmMin=Math.min(distKm-prevVTarget,posDesdeOrigen),kmMax=Math.max(distKm-prevVTarget,posDesdeOrigen);
      dias.push({dia:dias.length+1,desde:nombrePrevio,hasta:nombreDia,desdeCoord:coordPrevia,hastaCoord:coordDia,kmDia:arrVuelta[i].kmDia,tipo:"vuelta",kmMin,kmMax});
      prevVTarget=vTarget; coordPrevia=coordDia; nombrePrevio=nombreDia;
    }
    return {dias,rutaCoords:ruta.coords,rutaCum:cum,rutaDistKm:distKm,rutaDurMin:ruta.durMin};
  };

  // Fallback (si falla el geocoding o OSRM no responde): el esqueleto se lo pedimos a la IA,
  // como antes.
  const generarEsqueletoIA=async(opcion,totalDias)=>{
    const horaLimite=calcHoraLimite(viaje.fDevol,viaje.buffer);
    const data=await callGroq(apiKey,[

${viaje.pers} personas. Presupuesto: ${presuTxt}${viaje.notas?" Preferencias: "+viaje.notas:""}

LUGARES TURÍSTICOS REALES Y VERIFICADOS QUE ESTÁN SOBRE ESTE TRAMO (verificados con OpenStreetMap, pegados al camino — priorizá elegir de esta lista, e incluí TODOS los que razonablemente entren en el tiempo disponible del día, no solo uno o dos): ${listaAtr}

  const generarItinerario=async(opcion,oi)=>{
    if(!viaje||!apiKey) return;
    setLoadingDetalle(true);setGenerandoIdx(oi??null);
    const totalDias=calcDias(viaje.fRetiro,viaje.fDevol);
    const esAR=(lat,lng)=>lat&&lng&&lat>=-55&&lat<=-21&&lng>=-73&&lng<=-53;
    try{
      setProgresoDia({actual:0,total:totalDias});
      // Esqueleto REAL anclado a OSRM (con fallback a la IA si falla el geocoding/OSRM).
      let esqueletoInfo=await construirEsqueletoReal(opcion,totalDias);
      const sinAnclarReal=!esqueletoInfo;
      if(!esqueletoInfo) esqueletoInfo=await generarEsqueletoIA(opcion,totalDias);
      if(sinAnclarReal) setTimeout(()=>alert(`⚠️ No pude verificar "${viaje.origen}" → "${viaje.destino}" contra el mapa real (nombre no encontrado o sin ruta calculable). El itinerario se generó con estimaciones de la IA, sin garantía de que las distancias sean correctas. Revisá que el origen y destino sean nombres reales de ciudad/localidad.`),300);
      const esqueleto=esqueletoInfo.dias;
      const diasResultado=[];
      let contextoPrevio=null;
      const presTotal={combustible:0,alojamiento:0,comida:0,extras:0,total:0};
      for(let d=1;d<=totalDias;d++){
        setProgresoDia({actual:d,total:totalDias});
        const esqueletoDia=esqueleto[d-1];
        const tipoDia=esqueletoDia?.tipo||(d===totalDias?"vuelta":"ida");
        const esEstadia=tipoDia==="estadia";

        const desdeTxt=(esqueletoDia?.desde||viaje.origen)+", Argentina";
        const hastaTxt=(esqueletoDia?.hasta||viaje.destino)+", Argentina";
        // Si el esqueleto real ya trae las coordenadas (caso normal), no hace falta re-geocodificar.
        const desdeCoord=esqueletoDia?.desdeCoord||await geocodeNominatim(desdeTxt);
        if(!esqueletoDia?.desdeCoord) await sleep(1100);
        const hastaCoord=esqueletoDia?.hastaCoord||await geocodeNominatim(hastaTxt);
        if(!esqueletoDia?.hastaCoord) await sleep(1100);
        const ancla=hastaCoord||desdeCoord;
        // Contexto de destino real para re-geocodificar lugares sueltos que mencione la IA
        // (en el día de ida-y-vuelta, "hasta" es la propia casa, así que el contexto útil es el destino).
        const contextoGeocodeTxt=tipoDia==="idaYvuelta"?viaje.destino+", Argentina":hastaTxt;

        const hayTramoReal=esqueletoInfo.rutaCoords&&esqueletoDia?.kmMin!=null&&esqueletoDia?.kmMax!=null;
        // Puntos de muestra sobre el trazo real de ESTE día — se usan tanto para buscar POIs
        // en corredor como para detectar si el camino es de tierra/ripio o asfaltado.
        const puntosCorredor=hayTramoReal?muestrearPuntosRuta(esqueletoInfo.rutaCoords,esqueletoInfo.rutaCum,esqueletoDia.kmMin,esqueletoDia.kmMax):null;
        const tipoCaminoDia=hayTramoReal?await tipoDeCaminoSegmento(puntosCorredor):"desconocido";
        const toleranciaDia=toleranciaPorTipoCamino(tipoCaminoDia);

        let poisDelDia={atractivos:[],alojamientos:[],restaurantes:[]};
        if(hayTramoReal){
          // Corredor real: se muestrean varios puntos a lo largo del tramo de ESTE día sobre
          // el trazo real, y se busca cerca de cada uno (con radio chico) — así los lugares
          // encontrados están realmente sobre el camino del día, no en otro valle.
          poisDelDia=await buscarPOIsCorredor(puntosCorredor,12000,hastaCoord?.lat,hastaCoord?.lng);
        } else if(desdeCoord&&hastaCoord){
          const distDD=haversineKm(desdeCoord.lat,desdeCoord.lng,hastaCoord.lat,hastaCoord.lng);
          const midLat=(desdeCoord.lat+hastaCoord.lat)/2, midLng=(desdeCoord.lng+hastaCoord.lng)/2;
          const radioAtr=esEstadia?40000:Math.min(60000,Math.max(25000,distDD*500+15000));
          poisDelDia=await buscarPOIsDelDia(midLat,midLng,radioAtr,hastaCoord.lat,hastaCoord.lng);
        } else if(ancla){
          poisDelDia=await buscarPOIsDelDia(ancla.lat,ancla.lng,40000,ancla.lat,ancla.lng);
        }

        const parsedDia=await generarDia(opcion,d,totalDias,esqueletoDia,contextoPrevio,poisDelDia);

        // Sub-tramo real del día (para validar geografía) — solo existe si tenemos ruta real.
        const segDia=hayTramoReal?segmentoRuta(esqueletoInfo.rutaCoords,esqueletoInfo.rutaCum,esqueletoDia.kmMin,esqueletoDia.kmMax):null;
        const validarGeo=(lat,lng)=>{
          if(!esAR(lat,lng)) return false;
          // Tolerancia según el tipo de camino del tramo: hasta 20km si es de tierra/ripio,
          // hasta 50km si es asfaltado, 40km si no se pudo determinar.
          if(segDia) return cercaDeRuta(lat,lng,segDia,toleranciaDia);
          if(esqueletoInfo.rutaCoords) return cercaDeRuta(lat,lng,esqueletoInfo.rutaCoords,45); // estadía: tolerancia fija
          if(ancla) return haversineKm(lat,lng,ancla.lat,ancla.lng)<150; // fallback sin ruta real (esqueleto IA)
          return true;
        };

        for(const p of parsedDia.paradas){
          let match=null;
          if(p.tipo==="turistico"||p.tipo==="mirador") match=matchPOI(p.nombre,poisDelDia.atractivos);
          if(match){
            p.lat=match.lat; p.lng=match.lng; p.verificado=true; if(match.cat) p.cat=match.cat;
          } else {
            let necesitaGeocode=!validarGeo(p.lat,p.lng);
            if(necesitaGeocode){
              const coord=await geocodeNominatim(`${p.nombre}, ${contextoGeocodeTxt}`);
              await sleep(1100);
              if(coord&&validarGeo(coord.lat,coord.lng)){
                p.lat=coord.lat;p.lng=coord.lng;
              }else{
                p.lat=null;p.lng=null;
              }
            }
          }
          if(p.alojamientos?.length){
            p.alojamientos=p.alojamientos.map(a=>{
              const am=matchPOI(a.nombre,poisDelDia.alojamientos);
              return am?{...a,nombre:am.nombre,lat:am.lat,lng:am.lng}:a;
            });
          }
          if(p.restaurantes?.length){
            p.restaurantes=p.restaurantes.map(r=>{
              const rm=matchPOI(r.nombre,poisDelDia.restaurantes);
              return rm?{...r,nombre:rm.nombre}:r;
            });
          }
        }

        // Tiempos y distancias REALES (OSRM) entre paradas consecutivas con coordenadas
        // válidas, para no depender de lo que "calculó" la IA (que no maneja, no sabe cuánto
        // se tarda de verdad). Si una parada no tiene coordenadas, se deja su estimación.
        try{
          const waypoints=[];
          if(desdeCoord) waypoints.push({lat:desdeCoord.lat,lng:desdeCoord.lng,ref:null});
          parsedDia.paradas.forEach((p,i)=>{ if(esAR(p.lat,p.lng)) waypoints.push({lat:p.lat,lng:p.lng,ref:i}); });
          if(hastaCoord) waypoints.push({lat:hastaCoord.lat,lng:hastaCoord.lng,ref:null});
          if(waypoints.length>=2){
            const rutaDia=await getOSRMRoute(waypoints);
            if(rutaDia?.legs?.length===waypoints.length-1){
              rutaDia.legs.forEach((leg,k)=>{
                const ref=waypoints[k+1].ref;
                if(ref!=null){
                  parsedDia.paradas[ref].kmDesdeAnterior=`${Math.round(leg.distKm)} km`;
                  parsedDia.paradas[ref].tiempoManejo=fmtDuracionMin(Math.round(leg.durMin))||parsedDia.paradas[ref].tiempoManejo;
                }
              });
            }
          }
        }catch{}

        diasResultado.push({dia:d,titulo:parsedDia.titulo||`Día ${d}`,kmDelDia:parsedDia.kmDelDia||0,paradas:parsedDia.paradas});
        const pd=parsedDia.presupuestoDia||{};
        presTotal.combustible+=pd.combustible||0;
        presTotal.alojamiento+=pd.alojamiento||0;
        presTotal.comida+=pd.comida||0;
        presTotal.extras+=pd.extras||0;
        const ultima=parsedDia.paradas[parsedDia.paradas.length-1];
        contextoPrevio={nombre:ultima?.nombre,hora:ultima?.horaSalida||ultima?.horaLlegada};
      }
      presTotal.total=presTotal.combustible+presTotal.alojamiento+presTotal.comida+presTotal.extras;
      const diasConHorarios=recalcularHorariosViaje(diasResultado,viaje.horaSalidaCasa||viaje.fRetiro);
      const completa={...opcion,dias:diasConHorarios,presupuesto:presTotal};
      setOpcionSel(completa);
      LS.set("opcionSel",completa);
      setCompletadas([]);
      setTab("mapa");

      // Chequeo de tiempo de regreso: ¿el itinerario llega a casa a tiempo para lavar el auto
      // y devolverlo? Si no, se avisa (en vez de descubrirlo recién en el viaje).
      const horaLimiteDate=new Date(viaje.fDevol);
      horaLimiteDate.setHours(horaLimiteDate.getHours()-(viaje.buffer||3));
      const llegadaFinal=calcularLlegadaFinalDate(diasResultado,viaje.horaSalidaCasa||viaje.fRetiro);
      if(llegadaFinal>horaLimiteDate){
        const minTarde=Math.round((llegadaFinal-horaLimiteDate)/60000);
        setTimeout(()=>alert(`⚠️ Con este itinerario volverías a ${viaje.origen} aprox a las ${fmtHoraCorta(llegadaFinal)}, ${minTarde} minutos DESPUÉS del límite (${fmtHoraCorta(horaLimiteDate)}) para lavar el auto y devolverlo. Sacá alguna parada del último día desde la pantalla de Opciones para adelantar la llegada.`),300);
      }
    }catch(e){alert("Error: "+e.message);}
    setLoadingDetalle(false);setGenerandoIdx(null);setProgresoDia(null);
  };

    setModal("editarParada");
  };

  const guardarEdicionParada=()=>{
    if(!opcionSel?.dias||!fEP.clave) return;
    const [di,pi]=fEP.clave.split("-").map(Number);
    const nueva={...opcionSel,dias:opcionSel.dias.map((d,i)=>i!==di?d:{...d,paradas:d.paradas.map((p,j)=>j!==pi?p:{...p,nombre:fEP.nombre,tipo:fEP.tipo,descripcion:fEP.descripcion,duracion:fEP.duracion})})};
    const final={...nueva,dias:recalcularHorariosViaje(nueva.dias,viaje.horaSalidaCasa||viaje.fRetiro)};
    setOpcionSel(final);
    LS.set("opcionSel",final);
    setModal(null);
  };

  const moverParada=(clave,dir)=>{
    if(!opcionSel?.dias) return;
    const [di,pi]=clave.split("-").map(Number);
    const dia=opcionSel.dias[di];
    const nj=pi+dir;
    if(!dia||nj<0||nj>=dia.paradas.length) return;
    const paradas=[...dia.paradas];
    [paradas[pi],paradas[nj]]=[paradas[nj],paradas[pi]];
    const nueva0={...opcionSel,dias:opcionSel.dias.map((d,i)=>i!==di?d:{...d,paradas})};
    const nueva={...nueva0,dias:recalcularHorariosViaje(nueva0.dias,viaje.horaSalidaCasa||viaje.fRetiro)};
    setOpcionSel(nueva);
    LS.set("opcionSel",nueva);
  };

  const completarParada=(clave)=>{
    setCompletadas(p=>[...p,clave]);
  };

  const agregarGasto=()=>{
    if(!fG.monto) return;
    setGastos(p=>[...p,{id:Date.now(),cat:fG.cat,desc:fG.desc,monto:parseFloat(fG.monto),fecha:new Date().toLocaleDateString("es-AR")}]);
    setModal(null);setFG({cat:"nafta",desc:"",monto:""});
  };

  return(
    <div style={S.app} className="app-frame">
      <div style={{display:tab==="mapa"?"block":"none",height:"calc(100vh - 72px)"}}>
        <PantallaMapa viaje={viaje} opcionSel={opcionSel} posGPS={posGPS} estado={estado}/>
      </div>
      {tab==="inicio"    &&<PantallaInicio viaje={viaje} estado={estado} opciones={opciones} loadingIA={loadingIA} iaError={iaError} apiKey={apiKey} tRest={tRest} pct={pct} alerta={alerta} opcionSel={opcionSel} historial={historial} clima={clima} equipaje={equipaje} setEquipaje={setEquipaje} completadas={completadas} onCompletar={completarParada} onNuevo={abrirNuevoViaje} onEditarViaje={abrirEditarViaje} onIniciar={iniciarViaje} onFinalizar={finalizarViaje} onCompartir={compartirWhatsApp} setTab={setTab} onReintentar={()=>buscarIA(viaje)} sugerencias={sugerencias} loadingSug={loadingSug} sugError={sugError} onSugerir={sugerirDestinos} onPlanificarSugerencia={planificarDesdeSugerencia}/>}
      {tab==="opciones"  &&<PantallaOpciones opciones={opciones} opcionSel={opcionSel} loadingIA={loadingIA} viaje={viaje} setTab={setTab} generarItinerario={generarItinerario} loadingDetalle={loadingDetalle} generandoIdx={generandoIdx} progresoDia={progresoDia} onEliminarParada={eliminarParada} onEditarParada={abrirEditarParada} onMoverParada={moverParada} onAbrirAgregarParada={()=>setModal("parada")} onCompartir={compartirWhatsApp}/>}
      {tab==="gastos"    &&<PantallaGastos gastos={gastos} setGastos={setGastos} pers={pers} setPers={setPers} setModal={setModal}/>}
      {tab==="historial" &&<PantallaHistorial historial={historial} onEliminar={id=>setHistorial(p=>p.filter(h=>h.id!==id))}/>}
      {tab==="config"    &&<PantallaConfig apiKey={apiKey} setApiKey={setApiKey} darkMode={darkMode} setDarkMode={setDarkMode} lugaresGuardados={lugaresGuardados} onAgregarLugar={agregarLugarGuardado} onEliminarLugar={eliminarLugarGuardado}/>}
      {modal==="viaje" &&<ModalViaje fV={fV} setFV={setFV} onCrear={crearViaje} onCerrar={()=>setModal(null)} lugaresGuardados={lugaresGuardados}/>}
      {modal==="editarViaje" &&<ModalViaje fV={fV} setFV={setFV} onCrear={guardarEdicionViaje} onCerrar={()=>setModal(null)} editando={true} lugaresGuardados={lugaresGuardados}/>}
      {modal==="gasto" &&<ModalGasto fG={fG} setFG={setFG} onAgregar={agregarGasto} onCerrar={()=>setModal(null)}/>}
      {modal==="nafta" &&<ModalNafta fN={fN} setFN={setFN} onAgregarComoGasto={(costo,km)=>{setGastos(p=>[...p,{id:Date.now(),cat:"nafta",desc:`Nafta — ${km} km`,monto:costo,fecha:new Date().toLocaleDateString("es-AR")}]);setModal(null);}} onCerrar={()=>setModal(null)}/>}
      {modal==="parada"&&<ModalAgregarParada opcionSel={opcionSel} onAgregar={agregarParada} onCerrar={()=>setModal(null)}/>}
      {modal==="editarParada"&&<ModalEditarParada f={fEP} setF={setFEP} onGuardar={guardarEdicionParada} onCerrar={()=>setModal(null)}/>}
      <div style={S.nav}>
        {TABS.map(t=>(
          <button key={t.id} style={{...S.nvb(tab===t.id,t.color),position:"relative"}} onClick={()=>setTab(t.id)} aria-label={t.label}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:tab===t.id?"bold":"normal"}}>{t.label}</span>
            {t.id==="historial"&&historial.length>0&&<div style={{position:"absolute",top:6,right:"50%",transform:"translateX(10px)",background:"#718096",color:"white",borderRadius:"50%",width:15,height:15,fontSize:8,display:"flex",alignItems:"center",justifyContent:"center"}}>{historial.length}</div>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));}</script>
</body>
</html>
